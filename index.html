<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<title>Olive's Rainbow Pizza Party</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .overlay[hidden] { display: none; }
  .card { background: #fff; border: 4px solid #222; border-radius: 28px; padding: 24px 22px 26px; width: 100%; max-width: 340px;
    text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.18); }
  .emoji { font-size: 54px; line-height: 1.1; }
  h1 { margin: 6px 0 8px; font-size: 27px; line-height: 1.15;
    background: linear-gradient(90deg, #ff4d6d, #ff9f1c, #e6b800, #2dc653, #1e90ff, #9b5de5);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 8px 0; font-size: 17px; color: #333; line-height: 1.4; }
  .how { font-size: 16px; background: #fff6d6; border-radius: 16px; padding: 10px 12px; margin: 14px 0; }
  .party { font-size: 14px; color: #555; margin-top: 14px; }
  .score { font-size: 46px; font-weight: 800; color: #222; margin: 4px 0; }
  button { font: inherit; font-size: 22px; font-weight: 800; color: #fff; background: #ff4d6d; border: 4px solid #222;
    border-radius: 999px; padding: 12px 34px; margin-top: 12px; box-shadow: 0 5px 0 #222; cursor: pointer; }
  #mute { position: fixed; top: 58px; right: 12px; margin: 0; padding: 0; width: 44px; height: 44px; font-size: 22px; line-height: 1;
    background: #fff; border-width: 3px; box-shadow: 0 3px 0 #222; }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #222; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="mute" aria-label="Sound on or off">🔊</button>

<div class="overlay" id="start">
  <div class="card">
    <div class="emoji">🦄🍕🌈</div>
    <h1>Olive's Rainbow Pizza Party</h1>
    <p>Help the unicorn catch the pizza!</p>
    <div class="how">
      👆 Slide your finger to move<br>
      🍕 = 1 &nbsp; 🌈 = 5 &nbsp; 🥦 = yuck!
    </div>
    <button id="playBtn">Play!</button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="emoji" id="overEmoji">🎉</div>
    <h1 id="overTitle">Yum!</h1>
    <div class="score"><span id="finalScore">0</span> 🍕</div>
    <p id="bestLine"></p>
    <button id="againBtn">Play again</button>
    <p class="party">See you at Olive's party!<br>Sat 5 Dec · 9:30am · Bulli Beach Reserve</p>
  </div>
</div>

<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 0, H = 0, S = 60;
  var ROUND = 40;                       // seconds per game
  var COLORS = ['#ff4d6d', '#ff9f1c', '#ffd60a', '#2dc653', '#1e90ff', '#9b5de5'];
  var state = 'start', score = 0, timeLeft = ROUND, spawnIn = 0, last = 0, best = 0;
  var player = { x: 0, tx: 0, face: 1, squash: 0, wobble: 0 };
  var items = [], parts = [], clouds = [];
  var keys = {};
  var audio = null, muted = false;

  try { best = +localStorage.getItem('olivePizzaBest') || 0; } catch (e) {}

  function resize() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * d); cv.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
    S = Math.max(44, Math.min(84, Math.min(W, H) / 6.5));
    if (!player.x) { player.x = player.tx = W / 2; }
    player.tx = Math.max(S / 2, Math.min(W - S / 2, player.tx));
  }
  window.addEventListener('resize', resize);
  resize();
  for (var i = 0; i < 4; i++) clouds.push({ x: Math.random() * W, y: 40 + Math.random() * H * 0.35, s: 0.7 + Math.random() * 0.8, v: 6 + Math.random() * 10 });

  // ---------- sound ----------
  function beep(freq, dur, type, vol) {
    if (!audio || muted) return;
    try {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.3, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }

  function unlockAudio() {
    try {
      // lets iPhones play the sounds even when the ring/silent switch is on silent
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state !== 'running') audio.resume();
    } catch (e) {}
  }
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('touchend', unlockAudio);
  document.getElementById('mute').addEventListener('click', function () {
    muted = !muted; this.textContent = muted ? '🔇' : '🔊';
    if (!muted) beep(660, 0.12);
  });

  // ---------- input ----------
  function point(e) { player.tx = Math.max(S / 2, Math.min(W - S / 2, e.clientX)); }
  cv.addEventListener('pointerdown', point);
  cv.addEventListener('pointermove', point);
  window.addEventListener('keydown', function (e) { keys[e.key] = true; });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  // ---------- game ----------
  function startGame() {
    unlockAudio();
    document.getElementById('start').hidden = true;
    document.getElementById('over').hidden = true;
    items = []; parts = []; score = 0; timeLeft = ROUND; spawnIn = 0.4;
    player.x = player.tx = W / 2;
    state = 'play';
    beep(523, 0.12); setTimeout(function () { beep(784, 0.18); }, 110);
  }

  function endGame() {
    state = 'over';
    var isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('olivePizzaBest', best); } catch (e) {} }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('overEmoji').textContent = score >= 40 ? '🦄👑' : score >= 20 ? '🎉🍕' : '🌈';
    document.getElementById('overTitle').textContent = score >= 40 ? 'Pizza superstar!' : score >= 20 ? 'Yum yum yum!' : 'Nice catching!';
    document.getElementById('bestLine').textContent = isBest && score > 0 ? 'New best score! ⭐' : 'Best so far: ' + best;
    document.getElementById('over').hidden = false;
    [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { beep(f, 0.2); }, i * 120); });
  }

  function spawn(p) {
    var r = Math.random(), type = r < 0.68 ? 'pizza' : r < 0.80 ? 'rainbow' : 'yuck';
    items.push({
      type: type, ch: type === 'pizza' ? '🍕' : type === 'rainbow' ? '🌈' : '🥦',
      x: S * 0.6 + Math.random() * (W - S * 1.2), y: -S,
      vy: H * (0.30 + 0.25 * p) * (0.85 + Math.random() * 0.3),
      rot: Math.random() * 6.28, spin: (Math.random() - 0.5) * 3
    });
  }

  function burst(x, y, n, text) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.28, v = 80 + Math.random() * 220;
      parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, life: 0.7, max: 0.7, r: 4 + Math.random() * 5, c: COLORS[i % COLORS.length] });
    }
    if (text) parts.push({ x: x, y: y - S * 0.6, vx: 0, vy: -90, life: 0.8, max: 0.8, text: text });
  }

  function update(dt) {
    var i, it, p;
    for (i = 0; i < clouds.length; i++) { clouds[i].x += clouds[i].v * dt; if (clouds[i].x > W + 120) clouds[i].x = -120; }

    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i]; p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; if (!p.text) p.vy += 500 * dt;
    }

    if (state === 'over') {            // confetti rain behind the score card
      if (Math.random() < dt * 30) parts.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 60, vy: 120, life: 3, max: 3, r: 5 + Math.random() * 4, c: COLORS[(Math.random() * 6) | 0] });
      return;
    }
    if (state !== 'play') return;

    if (keys.ArrowLeft || keys.a) player.tx -= W * 1.1 * dt;
    if (keys.ArrowRight || keys.d) player.tx += W * 1.1 * dt;
    player.tx = Math.max(S / 2, Math.min(W - S / 2, player.tx));
    var dx = player.tx - player.x;
    if (Math.abs(dx) > 2) player.face = dx > 0 ? -1 : 1;   // the emoji faces left by default
    player.x += dx * Math.min(1, dt * 14);
    player.squash = Math.max(0, player.squash - dt * 4);
    player.wobble = Math.max(0, player.wobble - dt * 2.5);

    timeLeft -= dt;
    var prog = 1 - Math.max(0, timeLeft) / ROUND;
    spawnIn -= dt;
    if (spawnIn <= 0) { spawn(prog); spawnIn = 0.75 - 0.38 * prog; }

    var py = H - S * 1.25;
    for (i = items.length - 1; i >= 0; i--) {
      it = items[i];
      it.y += it.vy * dt; it.rot += it.spin * dt;
      if (Math.abs(it.x - player.x) < S * 0.8 && Math.abs(it.y - py) < S * 0.6) {
        if (it.type === 'yuck') {
          score = Math.max(0, score - 1); player.wobble = 1;
          burst(it.x, it.y, 0, 'Yuck!'); beep(140, 0.25, 'sawtooth', 0.18);
        } else {
          var pts = it.type === 'rainbow' ? 5 : 1;
          score += pts; player.squash = 1;
          burst(it.x, it.y, it.type === 'rainbow' ? 24 : 8, '+' + pts);
          beep(it.type === 'rainbow' ? 988 : 660 + Math.random() * 120, 0.12);
          if (it.type === 'rainbow') setTimeout(function () { beep(1319, 0.2); }, 90);
        }
        items.splice(i, 1);
      } else if (it.y > H + S) items.splice(i, 1);
    }
    if (timeLeft <= 0) endGame();
  }

  function emoji(ch, x, y, size, rot, sx, sy) {
    ctx.save();
    ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(sx || 1, sy || 1);
    ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, size * 0.06);
    ctx.restore();
  }

  function draw() {
    var i, p, g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#7cc8ff'); g.addColorStop(1, '#d9f2ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // big rainbow
    var R = Math.min(W * 0.62, H * 0.6), band = R * 0.075;
    ctx.lineWidth = band + 1;
    for (i = 0; i < 6; i++) {
      ctx.strokeStyle = COLORS[i]; ctx.globalAlpha = 0.55;
      ctx.beginPath(); ctx.arc(W / 2, H - S * 0.6, R - i * band, Math.PI, 0); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // clouds
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      ctx.beginPath();
      ctx.arc(c.x, c.y, 24 * c.s, 0, 6.3); ctx.arc(c.x + 28 * c.s, c.y - 12 * c.s, 30 * c.s, 0, 6.3);
      ctx.arc(c.x + 62 * c.s, c.y, 24 * c.s, 0, 6.3); ctx.rect(c.x, c.y, 62 * c.s, 24 * c.s);
      ctx.fill();
    }

    // grass
    ctx.fillStyle = '#6fd66f';
    ctx.beginPath(); ctx.ellipse(W / 2, H + S * 0.9, W * 0.9, S * 1.7, 0, 0, 6.3); ctx.fill();

    // falling things
    for (i = 0; i < items.length; i++) emoji(items[i].ch, items[i].x, items[i].y, S * 0.9, items[i].rot);

    // unicorn
    var q = player.squash, wob = Math.sin(player.wobble * 30) * player.wobble * 0.3;
    emoji('🦄', player.x, H - S * 1.05 + q * S * 0.08, S * 1.35, wob, player.face * (1 + q * 0.18), 1 - q * 0.15);

    // sparkles and floating text
    for (i = 0; i < parts.length; i++) {
      p = parts[i]; ctx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
      if (p.text) {
        ctx.font = '800 ' + Math.round(S * 0.5) + 'px "Arial Rounded MT Bold","Trebuchet MS",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(p.text, p.x, p.y);
        ctx.fillStyle = p.text === 'Yuck!' ? '#3a8f3a' : '#ff4d6d'; ctx.fillText(p.text, p.x, p.y);
      } else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill(); }
    }
    ctx.globalAlpha = 1;

    // score and timer
    if (state === 'play') {
      ctx.font = '800 30px "Arial Rounded MT Bold","Trebuchet MS",sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.strokeText('🍕 ' + score, 16, 36);
      ctx.fillStyle = '#222'; ctx.fillText('🍕 ' + score, 16, 36);
      var bw = Math.min(180, W * 0.42), bx = W - bw - 16, frac = Math.max(0, timeLeft / ROUND);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
      bar(bx, 26, bw, 20); ctx.fill(); ctx.stroke();
      if (frac > 0.02) {
        var rg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
        for (i = 0; i < 6; i++) rg.addColorStop(i / 5, COLORS[i]);
        ctx.fillStyle = rg; bar(bx + 3, 29, (bw - 6) * frac, 14); ctx.fill();
      }
    }
  }
  function bar(x, y, w, h) {
    var r = Math.min(h / 2, w / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('playBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
})();
</script>
</body>
</html>
